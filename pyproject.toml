[project]
name = "edtech-receipt-pdf"
version = "0.1.0"
description = "Issue PDF receipts after validating an edtech course delivery timeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = ["issue_receipt", "receipt_service"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
